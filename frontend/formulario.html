<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuários</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
</head>
<body>

    <header></header>

    <main>
        <section>
            <h1 id="page-title">Novo usuário</h1>

            <form id="user-form">
                <div>
                    <label for="name">Nome</label>
                    <input type="text" id="name" required minlength="3">
                </div>
                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div>
                    <label for="login">Login</label>
                    <input type="text" id="login" required minlength="3">
                </div>
                <div>
                    <label for="password">Senha</label>
                    <input type="password" id="password" required minlength="8">
                </div>

                <div id="form-message" role="status"></div>

                <div class="form-buttons">
                    <button class="btn" type="submit" id="submit-button">Salvar</button>
                    <button class="btn" type="button">Cancelar</button>
                </div>
            </form>
           
        </section>        
    </main>

    <footer></footer>
    <script type="module" src="js/form.js"></script>   
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
