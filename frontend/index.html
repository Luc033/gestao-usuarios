<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestão de Usuários</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main>
      <section class="w-75 mx-auto py-8">
        <div class="d-flex flex-column  gap-3 mb-5">
          <div class="d-flex flex-wrap   align-items-center justify-content-between gap-3">
            <div>
              <h1 class="fs-2 fw-semibold mb-1">Usuários cadastrados</h1>
              <p class="text-secondary mb-0">
                Gerencie os usuários do sistema.
              </p>
            </div>

            <a id="btn-new-user" class="btn btn-outline-secondary text-nowrap">
              <i class="bi bi-plus-lg me-2"></i> Novo usuário
            </a>
          </div>
        </div>

         <div class="input-group w-50 mt-10 ">
            <input
                type="text"
                id="search-user"
                class="form-control"
                placeholder="Pesquisar usuário..."
            >
            <button id="btn-search" class="btn btn-outline-secondary" type="button">
                <i class="bi bi-search"></i>
            </button>
        </div>

        <div class="table-responsive border rounded-3 overflow-auto mt-3">
          <table class="table table-striped mb-0">
            <colgroup>
              <col style="width: 5%" />
              <col style="width: 35%" />
              <col style="width: 30%" />
              <col style="width: 10%" />
              <col style="width: 20%" />
            </colgroup>

            <thead>
              <tr class="text-center">
                <th>Status</th>
                <th>Nome</th>
                <th>Email</th>
                <th>Login</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="users-list"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script type="module" src="js/index.js"></script>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
