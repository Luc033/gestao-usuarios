<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usuários</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
    />
  </head>
  <body class="bg-light">

    <main class="container py-5">
      <section class="w-75 mx-auto bg-white border rounded-4 shadow-sm p-5">
        <div
          class="d-flex align-items-center justify-content-between border-bottom pb-4 mb-4"
        >
          <div>
            <h1 id="page-title" class="fs-2 fw-semibold mb-1"> <i class="bi bi-pencil-square"></i> Novo usuário</h1>
            <p class="text-secondary mb-0">
              Preencha os dados para cadastrar ou editar um usuário.
            </p>
          </div>
        </div>

        <form id="user-form">
          <div
            class="hidden d-block bg-pale-red alert alert-danger rounded-3 mb-4 fg-danger"
            id="msg-erro"
          ></div>

          <div class="d-flex flex-wrap gap-3 mb-4">
  <div class="form-field" style="width: 140px; flex-shrink: 0;">
    <label for="active" class="form-label">Status</label>
    <select id="active" class="form-control form-control-lg readonly">
      <option value="1" selected >Ativo</option>
      <option value="0" >Inativo</option>
    </select>
  </div>

  <div class="form-field flex-grow-1" style="min-width: 200px;">
    <label for="name" class="form-label">Nome</label>
    <input
      type="text"
      id="name"
      class="form-control form-control-lg"
      placeholder="Digite o nome completo"
    />
  </div>
</div>

          <div class="mb-4">
            <label for="email" class="form-label fw-medium">Email</label>
            <input
              type="email"
              id="email"
              class="form-control form-control-lg"
              placeholder="Digite o e-mail"
            />
          </div>

          <div class="mb-4">
            <label for="login" class="form-label fw-medium">Login</label>
            <input
              type="text"
              id="login"
              class="form-control form-control-lg"
              placeholder="Digite o login"
            />
          </div>

          <div id="container-form-password" class="mb-4">
            <label for="password" class="form-label fw-medium">Senha</label>

            <div class="input-group">
              <input
                type="password"
                id="password"
                class="form-control form-control-lg"
                placeholder="Digite a senha"
              />
            </div>
          </div>

          <div
            class="form-buttons d-flex justify-content-end gap-3 border-top pt-4 mt-5"
          >
            <a
              href="/index"
              class="btn-text theme-danger px-4 py-2"
              type="button"
              >Cancelar</a
            >
            <button class="btn-solid theme-success px-5 py-2" type="submit">
              Salvar
            </button>
          </div>
        </form>

        <div
          class="hidden position-fixed top-0 start-0 w-100 vh-100 bg-black bg-50 z-dialog"
          id="modal-edit-password"
        >
          <div
            class="position-absolute top-50 start-50 translate-middle border rounded-4 d-flex flex-column align-items-center gap-4 border-secondary-subtle bg-white shadow-lg p-4 p-md-5"
            style="width: min(90%, 550px); height: max-content"
          >
            <div class="d-flex flex-column mb-2 w-100">
              <div
                class="border-bottom pb-3 mb-4 fw-semibold d-flex align-items-center"
              >
                <i class="bi bi-lock-fill me-3 fs-3 text-success"></i>
                <span class="fs-4">Alteração de senha</span>
              </div>

              <label for="new-passoword" class="form-label fw-medium mt-2 mb-2">
                Nova senha
                <span class="ms-2 fst-italic text-secondary small"
                  >(mínimo 8 caracteres)</span
                >
              </label>

              <input
                class="form-control form-control-lg"
                type="password"
                id="new-password"
                placeholder="Digite a nova senha..."
              />
            </div>

            <div
              class="invisible mb-2 w-100 p-3 rounded-3 fs-6 alert alert-danger rounded-3 bg-pale-red border-0"
              id="container-msg-password"
            >
              <i class="bi bi-exclamation-circle-fill me-2 fg-danger"></i>
              <span class="fg-danger" id="msg-password"></span>
            </div>

            <div
              id="btn-password-modal"
              class="w-100 mt-2 d-flex justify-content-end gap-3"
            >
              <button
                class="btn-text theme-danger px-4"
                type="button"
                id="btn-cancel-password"
              >
                Cancelar
              </button>
              <button
                class="btn-solid theme-success px-4"
                type="button"
                id="btn-save-password"
              >
                Salvar senha
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="js/users.js"></script>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
